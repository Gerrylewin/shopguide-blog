name: Fix broken Unsplash heroes once

on:
  push:
    branches: [fix/broken-unsplash-heroes]
    paths:
      - scripts/fix-broken-heroes.cjs
      - .github/workflows/fix-broken-heroes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Swap 15 dead Unsplash hero images for live photos'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/broken-unsplash-heroes
      - name: Apply hero replacements
        run: node scripts/fix-broken-heroes.cjs
      - name: Remove one-shot files
        run: |
          rm -f scripts/fix-broken-heroes.cjs .github/workflows/fix-broken-heroes.yml
      - name: Commit image swaps
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Swap 15 dead Unsplash hero images for live photos"
          git push
